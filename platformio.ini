[platformio]
default_envs = cardputer-adv-m8

; Offline hardware diagnostic. The installed launcher layout is not assumed.
[adv_common]
platform = platformio/espressif32@6.13.0
board = m5stack-stamps3
framework = arduino
platform_packages =
    platformio/framework-arduinoespressif32@3.20017.241212
    platformio/tool-esptoolpy@2.41100.260830
board_build.partitions = default_8MB.csv
board_build.flash_size = 8MB
extra_scripts = pre:tools/pio_build.py
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -Wl,--wrap=esp_partition_erase_range
    -DHW_VERSION=\"Cardputer-ADV\"
    -DM5STACK_CARDPUTER_ADV
    -DDEBUG_MUTE
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DMESHTASTIC_EXCLUDE_WIFI=1
    -DMESHTASTIC_EXCLUDE_BLUETOOTH=1
    -DMESHTASTIC_EXCLUDE_MQTT=1
    -DMESHTASTIC_EXCLUDE_WEBSERVER=1
    -DTINYGPS_OPTION_NO_CUSTOM_FIELDS
    -DPB_ENABLE_MALLOC=1
    -DPB_VALIDATE_UTF8=1
    -DOLEDDISPLAY_REDUCE_MEMORY
    -Ivendor/meshtastic-firmware/src
    -Ivendor/meshtastic-firmware/src/mesh
    -Ivendor/meshtastic-firmware/src/mesh/generated
    -Ivendor/meshtastic-firmware/src/platform/esp32
    -Ivendor/meshtastic-firmware/variants/esp32s3/m5stack_cardputer_adv
lib_deps =
    https://github.com/jgromes/RadioLib/archive/refs/tags/7.6.0.zip
    https://github.com/meshtastic/TinyGPSPlus/archive/71a82db35f3b973440044c476d4bcdc673b104f4.zip
    https://github.com/meshtastic/esp8266-oled-ssd1306/archive/2e26010040e028baee72e2093402fa7b3c59e430.zip
    https://github.com/meshtastic/st7789/archive/92bae2e4a307afb430c3b0bc3d661c55ee1565f0.zip
    https://github.com/nanopb/nanopb/archive/refs/tags/nanopb-0.4.9.1.zip
    https://github.com/meshtastic/ArduinoThread/archive/b841b0415721f1341ea41cccfb4adccfaf951567.zip

[env:cardputer-adv-m1]
extends = adv_common
build_src_filter = +<*> -<mesh/> -<storage/> -<ui/m2_console.cpp> -<ui/m4_shell.cpp> -<ui/ui_shell.cpp> -<m2_main.cpp>
build_flags =
    ${adv_common.build_flags}
    -DAPP_VERSION=\"0.1.1-m1\"

[adv_mesh]
build_flags =
    ${adv_common.build_flags}
    -DCARDPUTER_ADV_M2
    -DUSERPREFS_TZ_STRING=\"GMT0\"
    -DMESHTASTIC_EXCLUDE_ADMIN=1
    -DSERIAL_BUFFER_SIZE=4096
    -DUSE_THREAD_NAMES
    -DMAX_THREADS=40
    -DMESHTASTIC_EXCLUDE_SCREEN=1
    -DMESHTASTIC_EXCLUDE_INPUTBROKER=1
    -DMESHTASTIC_EXCLUDE_POWER_FSM=1
    -DMESHTASTIC_EXCLUDE_AUDIO=1
    -DMESHTASTIC_EXCLUDE_ACCELEROMETER=1
    -DMESHTASTIC_EXCLUDE_MAGNETOMETER=1
    -DMESHTASTIC_EXCLUDE_ENVIRONMENTAL_SENSOR=1
    -DMESHTASTIC_EXCLUDE_AIR_QUALITY_SENSOR=1
    -DMESHTASTIC_EXCLUDE_HEALTH_TELEMETRY=1
    -DMESHTASTIC_EXCLUDE_POWER_TELEMETRY=1
    -DMESHTASTIC_EXCLUDE_PAXCOUNTER=1
    -DMESHTASTIC_EXCLUDE_STOREFORWARD=1
    -DMESHTASTIC_EXCLUDE_CANNEDMESSAGES=1
    -DMESHTASTIC_EXCLUDE_SERIAL=1
    -DMESHTASTIC_EXCLUDE_EXTERNALNOTIFICATION=1
    -DMESHTASTIC_EXCLUDE_RANGETEST=1
    -DMESHTASTIC_EXCLUDE_DROPZONE=1
    -DMESHTASTIC_EXCLUDE_REPLYBOT=1
    -DMESHTASTIC_EXCLUDE_REMOTEHARDWARE=1
    -DMESHTASTIC_EXCLUDE_POWERSTRESS=1
    -DMESHTASTIC_EXCLUDE_GENERIC_THREAD_MODULE=1
    -DMESHTASTIC_EXCLUDE_POWERMON=1
    -DMESHTASTIC_EXCLUDE_STATUS=1
    -DMESHTASTIC_EXCLUDE_ATAK=1
    -DMESHTASTIC_EXCLUDE_DETECTIONSENSOR=1
    -DMESHTASTIC_EXCLUDE_NEIGHBORINFO=1
    -DMESHTASTIC_EXCLUDE_WAYPOINT=1

[env:cardputer-adv-m2]
extends = env:cardputer-adv-m1
build_src_filter = +<*> -<main.cpp> -<board/board.cpp> -<ui/diagnostics.cpp>
build_flags =
    ${adv_mesh.build_flags}
    -DAPP_VERSION=\"0.2.1-m2\"
lib_deps =
    ${env:cardputer-adv-m1.lib_deps}
    https://github.com/meshtastic/OneButton/archive/fa352d668c53f290cfa480a5f79ad422cd828c70.zip
    https://github.com/meshtastic/arduino-fsm/archive/7db3702bf0cfe97b783d6c72595e3f38e0b19159.zip
    https://github.com/Erriez/ErriezCRC32/archive/refs/tags/1.0.1.zip
    https://github.com/end2endzone/NonBlockingRTTTL/archive/refs/tags/1.4.0.zip
    rweather/Crypto@0.4.0

[env:cardputer-adv-m3]
extends = env:cardputer-adv-m2
build_flags =
    ${adv_mesh.build_flags}
    -DAPP_VERSION=\"0.3.0-m3\"
    -DCARDPUTER_ADV_M3

[env:cardputer-adv-m4]
extends = env:cardputer-adv-m3
build_flags =
    ${adv_mesh.build_flags}
    -DAPP_VERSION=\"0.4.0-m4\"
    -DCARDPUTER_ADV_M3
    -DCARDPUTER_ADV_M4

[env:cardputer-adv-m5]
extends = env:cardputer-adv-m4
build_flags =
    ${adv_mesh.build_flags}
    -DAPP_VERSION=\"0.5.0-m5\"
    -DCARDPUTER_ADV_M3
    -DCARDPUTER_ADV_M4
    -DCARDPUTER_ADV_M5

[env:cardputer-adv-m6]
extends = env:cardputer-adv-m5
build_flags =
    ${adv_mesh.build_flags}
    -DAPP_VERSION=\"0.6.0-m6\"
    -DCARDPUTER_ADV_M3
    -DCARDPUTER_ADV_M4
    -DCARDPUTER_ADV_M5
    -DCARDPUTER_ADV_M6
    -DARDUINO_LOOP_STACK_SIZE=16384

[env:cardputer-adv-m7]
extends = env:cardputer-adv-m6
build_flags =
    ${adv_mesh.build_flags}
    -DAPP_VERSION=\"0.7.2-m7\"
    -DCARDPUTER_ADV_M3
    -DCARDPUTER_ADV_M4
    -DCARDPUTER_ADV_M5
    -DCARDPUTER_ADV_M6
    -DCARDPUTER_ADV_M7
    -DARDUINO_LOOP_STACK_SIZE=16384
    -DCARDPUTER_ADV_M7_NODES
    -DCARDPUTER_ADV_UI_V2
    -DLV_CONF_INCLUDE_SIMPLE
lib_deps =
    ${env:cardputer-adv-m6.lib_deps}
    lvgl/lvgl@8.3.11

[env:cardputer-adv-m8]
extends = env:cardputer-adv-m7
build_flags =
    ${adv_mesh.build_flags}
    -DAPP_VERSION=\"1.0.1\"
    -DCARDPUTER_ADV_M3
    -DCARDPUTER_ADV_M4
    -DCARDPUTER_ADV_M5
    -DCARDPUTER_ADV_M6
    -DCARDPUTER_ADV_M7
    -DCARDPUTER_ADV_M7_NODES
    -DCARDPUTER_ADV_UI_V2
    -DLV_CONF_INCLUDE_SIMPLE
    -DARDUINO_LOOP_STACK_SIZE=16384
    -DCARDPUTER_ADV_M8
